name: 크롤링 테스트

on:
  workflow_dispatch:        # 수동 실행 전용 (Actions → 크롤링 테스트 → Run workflow)
    inputs:
      sample:
        description: '도메인당 테스트 기사 수'
        required: false
        default: '3'
      min_len:
        description: '성공으로 칠 최소 본문 길이(자)'
        required: false
        default: '300'
      include_jb:
        description: '정보원 외부 feeds.json 포함 (on/off)'
        required: false
        default: 'on'

jobs:
  crawl-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 크롤링 테스트
        env:
          SAMPLE:     ${{ github.event.inputs.sample }}
          MIN_LEN:    ${{ github.event.inputs.min_len }}
          INCLUDE_JB: ${{ github.event.inputs.include_jb }}
        run: python scripts/crawl_test.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crawl_test_result.json
          git diff --staged --quiet \
            && echo "변경 없음" \
            || (git commit -m "chore: crawl test result [skip ci]" && \
                for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done)
